  <section class="container contact-section">
    <h1>Contattaci</h1>
    <p>Pronto a dare forma alle tue idee? Lasciaci un messaggio.</p>
    
    <div class="contact-form">
      <form action="https://formsubmit.co/studioform@tundi.it" method="POST">
          <!-- Configurazione FormSubmit -->
          <input type="hidden" name="_subject" value="Nuovo messaggio dal sito Tundi Studioform!">
          <input type="hidden" name="_captcha" value="false">
        <div class="form-group">
          <label for="name">Il tuo nome</label>
          <input type="text" id="name" name="name" required placeholder="Es. Mario Rossi">
        </div>
        <div class="form-group">
          <label for="email">La tua email</label>
          <input type="email" id="email" name="email" required placeholder="Es. mario@example.com">
        </div>
        <div class="form-group">
          <label for="message">Il tuo messaggio</label>
          <textarea id="message" name="message" required placeholder="Raccontami il tuo progetto..."></textarea>
        </div>
        <button type="submit" class="btn" style="width: 100%; text-align: center;">Invia Messaggio</button>
      </form>
    </div>
  </section>
